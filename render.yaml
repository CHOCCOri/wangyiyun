services:
  - type: web
    name: clear-glass-meting-bridge
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: METING_ALLOWED_ORIGINS
        sync: false
      - key: METING_SESSION_SECRET
        generateValue: true
      - key: METING_SESSION_HOURS
        value: 12
      - key: METING_RATE_LIMIT
        value: 120
